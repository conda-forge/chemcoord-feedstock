{% set name = "chemcoord" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/chemcoord-{{ version }}.tar.gz
  sha256: f725a3da458b5e2e98b3f78890f1b5b111d1c5ce15e40224d9fa4dc989953a4d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - numba >=0.35
    - numpy >=1.0
    - pandas >=1.0
    - pymatgen
    - python >=3.7
    - six
    - sortedcontainers
    - sympy

test:
  imports:
    - chemcoord
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mcocdawc/chemcoord
  summary: Python module for dealing with chemical coordinates.
  license: LGPL-3.0-only
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ghutchis
    - mcocdawc
